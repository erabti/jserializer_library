name: merging_builder

description: MergingBuilder reads several input files and writes merged output
  to one file. StandaloneBuilder enables output to a custom folder with custom
  output file name.

version: 0.3.0

homepage: https://github.com/simphotonics/merging_builder

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  analyzer: ">=8.0.0 <10.0.0"
  build: ">=3.0.0 <5.0.0"
  build_runner: ">=2.4.0 <3.0.0"
  dart_style: ">=3.0.0 <4.0.0"
  directed_graph: ^0.4.3
  exception_templates: ^0.3.1
  file: ^7.0.0
  glob: ^2.1.1
  lazy_memo: ^0.2.3
  meta: ^1.15.0
  path: ^1.9.0
  quote_buffer: ^0.2.3
  source_gen: ">=4.0.0 <5.0.0"

dev_dependencies:
  build_test: ^3.0.0
  crypto: ^3.0.3
  lints: ^5.0.0
  test: ^1.25.0
