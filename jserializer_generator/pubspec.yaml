name: jserializer_generator
description: Code generator for jserializer - serialization done right.
version: 1.2.0
publish_to: none

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  analyzer: ">=8.0.0 <10.0.0"
  build: ">=3.0.0 <5.0.0"
  build_runner: ">=2.4.0 <3.0.0"
  code_builder: ">=4.5.0 <5.0.0"
  dart_style: ">=3.0.0 <4.0.0"
  source_gen: ">=4.0.0 <5.0.0"
  fpdart: ^1.2.0
  change_case: ^2.0.1
  barbecue: ^0.5.0
  collection: ^1.18.0
  path: ^1.9.0
  jserializer:
    git:
      url: https://github.com/abdalraheemKshinba/jserializer_library.git
      ref: feat/migrate-to-dart-3.7-analyzer-9
      path: jserializer/
  merging_builder:
    git:
      url: https://github.com/abdalraheemKshinba/jserializer_library.git
      ref: feat/migrate-to-dart-3.7-analyzer-9
      path: merging_builder/

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
